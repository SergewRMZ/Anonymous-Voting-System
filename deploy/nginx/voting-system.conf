# Sitio de NGINX en la VM: /etc/nginx/sites-available/voting-system.conf
# Empieza solo con HTTP. "sudo certbot --nginx -d <dominio> --redirect" agrega después el
# HTTPS (listen 443 y el certificado) y la redirección de HTTP a HTTPS.
#
# Cambia server_name si tu etiqueta DNS o tu región son otras.

server {
    listen 80;
    listen [::]:80;
    server_name evoting-system.belgiumcentral.cloudapp.azure.com;

    # Fotografías de candidatos: 2 MB más el resto del multipart.
    client_max_body_size 3m;

    # Keycloak (KC_HTTP_RELATIVE_PATH=/auth): se reenvía con la ruta completa.
    location /auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keycloak manda cabeceras y cookies grandes en el login.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # API Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Nada más se sirve desde este dominio.
    location / {
        return 404;
    }
}
