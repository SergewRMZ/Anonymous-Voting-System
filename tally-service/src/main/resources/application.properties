spring.application.name=tally-service
server.port=8084

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/voting_system
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

services.bulletin-board.base-url=${BULLETIN_BOARD_URL:http://localhost:8085}
services.election-service.base-url=${ELECTION_SERVICE_URL:http://localhost:8083}
services.internal.token=${INTERNAL_SERVICE_TOKEN:}