spring:
  application:
    name: api-gateway

  security:
    oauth2:
    # CLIENT CONFIGURATION FOR TOKEN RELAY
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
        registration:
          api-gateway-client:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      # Envíar el Token hacía los microservicios
      default-filters:
        - TokenRelay

      routes:
        # Authorization Microservice Path
        - id: authorization-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/elections/**
server:
  port: 9000