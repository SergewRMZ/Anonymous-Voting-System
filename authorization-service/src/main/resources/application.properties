spring.application.name=authorization-service
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/voting_system
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuración como servidor OAuth2.0 utilizando JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# election-service, por la red interna: estado de las elecciones.
services.election-service.base-url=${ELECTION_SERVICE_BASE_URL:http://localhost:8083}

# Cada cuánto se revisan las claves ACTIVE para expirar las de elecciones cerradas (ms).
authorization.keys.expiration-check-interval-ms=${AUTHORIZATION_KEYS_EXPIRATION_CHECK_INTERVAL_MS:60000}

# Directorio de las claves privadas de firma ciega.
# En contenedor se sobrescribe con APP_KEYS_DIRECTORY.
app.keys.directory=./authorization-service/keys

