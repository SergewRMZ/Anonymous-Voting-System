spring.application.name=election-service
server.port=8083

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/voting_system
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuración como servidor OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Tiempo definido para lanzar la scheduler a revisar el estado de la elección.
election.scheduler.close-check-interval-ms:60000

# Tamaño máximo de la foto de un candidato. El frontend muestra y valida el mismo límite (src/utils/candidatePhoto.ts).
election.candidate-photo.max-size=2MB
spring.servlet.multipart.max-file-size=${election.candidate-photo.max-size}
spring.servlet.multipart.max-request-size=3MB
