spring:
  application:
    name: api-gateway

  security:
    oauth2:
    # CLIENT CONFIGURATION FOR TOKEN RELAY
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
        registration:
          api-gateway-client:
            provider: keycloak
            client-id: ${KEYCLOAK_API_GATEWAY_CLIENT_ID}
            client-secret: ${KEYCLOAK_API_GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    gateway:
      # Envíar el Token hacía los microservicios
      default-filters:
        - TokenRelay

server:
  port: 9000

# Las rutas se definen en GatewayConfig.java
services:
  authorization-service:
    base-url: ${AUTHORIZATION_SERVICE_URL:http://localhost:8080}
  authentication-service:
    base-url: ${AUTHENTICATION_SERVICE_URL:http://localhost:8082}
  election-service:
    base-url: ${ELECTION_SERVICE_URL:http://localhost:8083}
  tally-service:
    base-url: ${TALLY_SERVICE_URL:http://localhost:8084}
  bulletin-board:
    base-url: ${BULLETIN_BOARD_SERVICE_URL:http://localhost:8085}