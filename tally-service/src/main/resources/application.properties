spring.application.name=tally-service
server.port=8084

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/voting_system
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Keycloak Congfiguration OAuth2.0 resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Keycloak Configuration OAuth2.0 Client
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.client.registration.tally-service.provider=keycloak
spring.security.oauth2.client.registration.tally-service.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.tally-service.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.tally-service.authorization-grant-type=client_credentials

# Services configuration
services.bulletin-board-service.base-url=${BULLETIN_BOARD_SERVICE_URL}